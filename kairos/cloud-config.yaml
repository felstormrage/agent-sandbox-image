#cloud-config
# The CI workflow replaces the password-hash placeholder with a per-run hash.
# For a local build, generate one with:
#
#   openssl passwd -6
#
# and substitute it before passing this file to AuroraBoot or baking it into a
# qcow2 image.

hostname: kairos-{{ trunc 4 .MachineID }}

users:
  - name: nithin
    passwd: "__PASSWORD_HASH__"
    lock_passwd: false
    shell: /usr/bin/fish
    groups:
      - wheel
      - kvm
    ssh_authorized_keys:
      - "__SSH_PUBLIC_KEY__"
    sudo: ALL=(ALL) NOPASSWD:ALL

# SSH is key-only. The password above is for the serial console only.
install:
  auto: true
  reboot: true
  device: "auto"
  ssh_hardening: true
  selinux:
    enabled: true
    mode: permissive
  grub_options:
    extra_cmdline: "console=tty0 console=ttyS0,115200n8"
