#cloud-config
# Copy this file to the platform repository and replace every placeholder
# before using it to install a node. This example intentionally contains no SSH
# secret, cluster token, or production kubeconfig.

hostname: homelab-{{ trunc 6 .MachineID }}

users:
  - name: kairos
    groups:
      - admin
    ssh_authorized_keys:
      # Replace with your actual ed25519 public key before installation.
      - ssh-ed25519 REPLACE_WITH_YOUR_PUBLIC_KEY homelab

install:
  auto: true
  device: auto
  reboot: true
  source: oci:ghcr.io/felstormrage/agent-sandbox-image:kairos-0.1.0

k3s:
  enabled: true
  args:
    # Flannel and network policy are replaced by the platform Cilium stack.
    - --flannel-backend=none
    - --disable-network-policy
    # Ingress and load-balancer implementations belong to the platform stack.
    - --disable=traefik,servicelb
    # Prevent accidental exposure of a cluster admin kubeconfig.
    - --write-kubeconfig-mode=0600
