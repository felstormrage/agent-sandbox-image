name: Build sandbox image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      opencode_version:
        description: "OpenCode version (leave empty to use minimal.Dockerfile)"
        required: false
        type: string
  schedule:
    # Weekly rebuild to pick up Chainguard base-image updates.
    - cron: "17 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.opencode.outputs.version }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve OpenCode version
        id: opencode
        env:
          REQUESTED_VERSION: ${{ inputs.opencode_version }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION:-}"
          if [ -z "$version" ]; then
            version="$(sed -n 's/^ARG OPENCODE_VERSION=//p' minimal.Dockerfile | head -n1)"
          fi
          version="${version#v}"
          if [ -z "$version" ]; then
            echo "Could not determine an OpenCode version" >&2
            exit 1
          fi
          if ! [[ "$version" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "Invalid OpenCode version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=opencode-${{ steps.opencode.outputs.version }}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=opencode-sandbox
            org.opencontainers.image.description=Minimal OpenCode sandbox based on Chainguard Wolfi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: minimal.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OPENCODE_VERSION=${{ steps.opencode.outputs.version }}
          cache-from: type=gha,scope=opencode-sandbox
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=opencode-sandbox' || '' }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}

  build-cms:
    name: Build CMS image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in even for pull requests so the base image can be pulled when the
      # GHCR package is private.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build from the minimal image published by the build job above, so the
      # CMS image always layers on the same commit's OpenCode version. Pull
      # requests do not publish images, so they start from the latest release.
      - name: Resolve base image
        id: base
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            tag="latest"
          else
            tag="opencode-${{ needs.build.outputs.version }}"
          fi
          echo "ref=${REGISTRY}/${{ needs.build.outputs.image }}:${tag}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.build.outputs.image }}
          tags: |
            type=raw,value=cms-latest,enable={{is_default_branch}}
            type=ref,event=branch,suffix=-cms
            type=ref,event=pr,suffix=-cms
            type=semver,pattern={{version}},suffix=-cms
            type=semver,pattern={{major}}.{{minor}},suffix=-cms
            type=raw,value=opencode-${{ needs.build.outputs.version }}-cms
            type=sha,suffix=-cms
          labels: |
            org.opencontainers.image.title=opencode-cms-sandbox
            org.opencontainers.image.description=OpenCode CMS sandbox with Chromium runtime libraries, Playwright, and cloudflared

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cms.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.ref }}
          cache-from: type=gha,scope=opencode-cms
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=opencode-cms' || '' }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}
