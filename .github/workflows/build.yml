name: Build sandbox images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      opencode_version:
        description: "OpenCode version (leave empty to use opencode/minimal.Dockerfile)"
        required: false
        type: string
  schedule:
    # Weekly rebuild to pick up base-image updates for OpenCode, Kairos, and
    # the Fedora minimal bootc image, and to refresh both qcow2 artifacts.
    - cron: "17 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  lint:
    name: Validate shell and config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml shellcheck

      - name: Validate shell scripts
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do
            bash -n "${script}"
          done
          shellcheck -S error scripts/*.sh

      - name: Validate YAML, TOML, and JSON
        run: |
          python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          import yaml

          for path in (".github/workflows/build.yml", "kairos/cloud-config.yaml"):
              yaml.safe_load(Path(path).read_text())
              print(f"{path}: OK")

          tomllib.loads(Path("fedora-minimal/config.toml").read_text())
          print("fedora-minimal/config.toml: OK")

          json.loads(Path("renovate.json").read_text())
          print("renovate.json: OK")
          PY

  build:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.opencode.outputs.version }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compute lowercase image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve OpenCode version
        id: opencode
        env:
          REQUESTED_VERSION: ${{ inputs.opencode_version }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION:-}"
          if [ -z "$version" ]; then
            version="$(sed -n 's/^ARG OPENCODE_VERSION=//p' opencode/minimal.Dockerfile | head -n1)"
          fi
          version="${version#v}"
          if [ -z "$version" ]; then
            echo "Could not determine an OpenCode version" >&2
            exit 1
          fi
          if ! [[ "$version" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "Invalid OpenCode version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/opencode
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=opencode-${{ steps.opencode.outputs.version }}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=opencode-sandbox
            org.opencontainers.image.description=Minimal OpenCode sandbox based on Chainguard Wolfi

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: opencode/minimal.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OPENCODE_VERSION=${{ steps.opencode.outputs.version }}
          cache-from: type=gha,scope=opencode-sandbox
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=opencode-sandbox' || '' }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}

  build-cms:
    name: Build CMS image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Log in even for pull requests so the base image can be pulled when the
      # GHCR package is private.
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build from the minimal image published by the build job above, so the
      # CMS image always layers on the same commit's OpenCode version. Pull
      # requests do not publish images, so they start from the latest release.
      - name: Resolve base image
        id: base
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            tag="latest"
          else
            tag="opencode-${{ needs.build.outputs.version }}"
          fi
          echo "ref=${REGISTRY}/${{ needs.build.outputs.image }}/opencode:${tag}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.build.outputs.image }}/cms
          tags: |
            type=raw,value=cms-latest,enable={{is_default_branch}}
            type=ref,event=branch,suffix=-cms
            type=ref,event=pr,suffix=-cms
            type=semver,pattern={{version}},suffix=-cms
            type=semver,pattern={{major}}.{{minor}},suffix=-cms
            type=raw,value=opencode-${{ needs.build.outputs.version }}-cms
            type=sha,suffix=-cms
          labels: |
            org.opencontainers.image.title=opencode-cms-sandbox
            org.opencontainers.image.description=OpenCode CMS sandbox with Chromium runtime libraries, Playwright, and cloudflared

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: opencode/cms.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.ref }}
          cache-from: type=gha,scope=opencode-cms
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=opencode-cms' || '' }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}

  build-kairos:
    name: Build Kairos image
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compute image coordinates
        id: image
        run: |
          set -euo pipefail
          name="${GITHUB_REPOSITORY,,}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            base="$(sed -n 's/^ARG VERSION=//p' kairos/Containerfile | head -n1)"
            IFS=. read -r major minor patch <<< "${base}"
            # Advance the patch with the monotonic workflow counter, then retain
            # the commit as a prerelease identifier for uniqueness and tracing.
            patch=$((patch + GITHUB_RUN_NUMBER))
            version="${major}.${minor}.${patch}-$(git rev-parse --short=7 HEAD)"
          fi
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Kairos image version: ${version}" >&2
            exit 1
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: v3.1.6

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/kairos
          tags: |
            type=raw,value=kairos-${{ steps.image.outputs.version }}
            type=ref,event=branch,prefix=kairos-branch-
            type=ref,event=pr,prefix=kairos-pr-
            type=sha,prefix=kairos-sha-
          labels: |
            org.opencontainers.image.title=kairos-sandbox
            org.opencontainers.image.description=Fedora-based Kairos sandbox host with gVisor, Firecracker, Podman, Homebrew, and SSH key sync
            org.opencontainers.image.version=${{ steps.image.outputs.version }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: kairos/Containerfile
          # The host image is amd64-only: it contains native gVisor and
          # Firecracker binaries selected with uname -m at build time.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
          cache-from: type=gha,scope=kairos-host
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=kairos-host' || '' }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Sign Kairos image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/kairos
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build.yml@${GITHUB_REF}$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"

      - name: Install qemu and OVMF
        if: github.event_name != 'pull_request'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils qemu-system-x86 ovmf expect

      # Publish a pre-installed qcow2 after the OCI image is available in GHCR.
      # Pull-request builds intentionally skip this because they do not publish
      # the image that AuroraBoot needs to consume.
      - name: Build Kairos qcow2
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/kairos:kairos-${{ steps.image.outputs.version }}
          HOST_PASSWORD: ${{ secrets.HOST_PASSWORD }}
          HOST_SSH_PUBLIC_KEY: ${{ secrets.HOST_SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE_REF}"
          mkdir -p build/kairos build/artifacts

          public_key="${HOST_SSH_PUBLIC_KEY:-}"
          if [ -z "${public_key}" ]; then
            echo "Generating temporary SSH key pair for this build..."
            ssh_keyfile="build/temp_ssh_key"
            ssh-keygen -t ed25519 -f "${ssh_keyfile}" -N "" -C "temporary-build-key"
            public_key="$(cat ${ssh_keyfile}.pub)"
          fi
          printf '%s\n' "${public_key}" | ssh-keygen -l -f - >/dev/null

          password="${HOST_PASSWORD:-$(openssl rand -hex 16)}"
          echo "::add-mask::${password}"
          hash="$(printf '%s' "${password}" | openssl passwd -6 -stdin)"
          TEMPLATE=kairos/cloud-config.yaml \
          OUTPUT=build/kairos-cloud-config.yaml \
          PASSWORD_HASH="${hash}" \
          SSH_PUBLIC_KEY="${public_key}" \
          python3 - <<'PY'
          import os
          from pathlib import Path

          text = Path(os.environ["TEMPLATE"]).read_text()
          text = text.replace("__PASSWORD_HASH__", os.environ["PASSWORD_HASH"])
          text = text.replace("__SSH_PUBLIC_KEY__", os.environ["SSH_PUBLIC_KEY"])
          Path(os.environ["OUTPUT"]).write_text(text)
          PY

          docker run --rm --privileged \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/build/kairos:/aurora" \
            -v "${PWD}/build/kairos-cloud-config.yaml:/cloud-config.yaml:ro" \
            quay.io/kairos/auroraboot:v4.7.0@sha256:cba8ccbc0914e439945b1d370e609c4ce70d5f1c1533d34506581243f3824899 \
            --debug \
            --set "disable_http_server=true" \
            --set "disable_netboot=true" \
            --set "disk.efi=true" \
            --set "container_image=oci:${IMAGE_REF}" \
            --set "state_dir=/aurora" \
            --cloud-config /cloud-config.yaml
          sudo chown -R "$(id -u):$(id -g)" build

          raw="$(find build/kairos -type f -name '*.raw' -print -quit)"
          if [ -z "${raw}" ]; then
            echo "AuroraBoot did not produce a raw disk image" >&2
            find build/kairos -maxdepth 2 -type f >&2
            exit 1
          fi
          qcow="build/artifacts/kairos-${{ steps.image.outputs.version }}-amd64.qcow2"
          qemu-img convert -c -f raw -O qcow2 "${raw}" "${qcow}"
          qemu-img info "${qcow}"
          qemu-img check "${qcow}"
          ./scripts/smoke-test-qcow2.sh "${qcow}" "${password}" kairos
          rm -rf build/kairos build/kairos-cloud-config.yaml

          printf 'user: nithin\npassword: %s\n' "${password}" > build/artifacts/credentials.txt
          (cd build/artifacts && sha256sum ./*.qcow2 > SHA256SUMS)

      - name: Upload Kairos qcow2 artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kairos-${{ steps.image.outputs.version }}-amd64-qcow2
          path: build/artifacts
          if-no-files-found: error
          retention-days: 30

      # Keep the moving channel behind the artifact build. Auto-updating hosts
      # follow kairos-latest, so it is promoted only after the qcow2 was built
      # and uploaded successfully.
      - name: Promote kairos-latest
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${IMAGE}:kairos-latest" "${IMAGE}@${DIGEST}"

  build-fedora-minimal:
    name: Build Fedora minimal image
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compute image coordinates
        id: image
        run: |
          set -euo pipefail
          name="${GITHUB_REPOSITORY,,}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            base="$(sed -n 's/^ARG VERSION=//p' fedora-minimal/Containerfile | head -n1)"
            IFS=. read -r major minor patch <<< "${base}"
            patch=$((patch + GITHUB_RUN_NUMBER))
            version="${major}.${minor}.${patch}-$(git rev-parse --short=7 HEAD)"
          fi
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Fedora minimal image version: ${version}" >&2
            exit 1
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: v3.1.6

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/fedora-minimal
          tags: |
            type=raw,value=fedora-minimal-${{ steps.image.outputs.version }}
            type=ref,event=branch,prefix=fedora-minimal-branch-
            type=ref,event=pr,prefix=fedora-minimal-pr-
            type=sha,prefix=fedora-minimal-sha-
          labels: |
            org.opencontainers.image.title=fedora-minimal-sandbox
            org.opencontainers.image.description=Minimal Fedora bootc sandbox host with fish, Homebrew, and SSH key sync
            org.opencontainers.image.version=${{ steps.image.outputs.version }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: fedora-minimal/Containerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
          cache-from: type=gha,scope=fedora-minimal
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=fedora-minimal' || '' }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Sign Fedora minimal image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/fedora-minimal
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build.yml@${GITHUB_REF}$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"

      - name: Install podman, qemu, and OVMF
        if: github.event_name != 'pull_request'
        run: |
          sudo apt-get update
          sudo apt-get install -y podman qemu-utils qemu-system-x86 ovmf expect

      - name: Build and test Fedora minimal qcow2
        if: github.event_name != 'pull_request'
        env:
          TEST_REF: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/fedora-minimal:fedora-minimal-${{ steps.image.outputs.version }}
          LATEST_REF: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/fedora-minimal:fedora-minimal-latest
          DIGEST: ${{ steps.push.outputs.digest }}
          IS_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          HOST_PASSWORD: ${{ secrets.HOST_PASSWORD }}
          HOST_SSH_PUBLIC_KEY: ${{ secrets.HOST_SSH_PUBLIC_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BIB: quay.io/centos-bootc/bootc-image-builder:latest@sha256:a829b782ecee4764edcac472d5672a76f20002143618fcfbd17dc1cc7319e642
        run: |
          set -euo pipefail
          mkdir -p build/artifacts build/fedora-minimal-test build/fedora-minimal

          public_key="${HOST_SSH_PUBLIC_KEY:-}"
          if [ -z "${public_key}" ]; then
            echo "Generating temporary SSH key pair for this build..."
            ssh_keyfile="build/temp_ssh_key"
            ssh-keygen -t ed25519 -f "${ssh_keyfile}" -N "" -C "temporary-build-key"
            public_key="$(cat ${ssh_keyfile}.pub)"
          fi
          printf '%s\n' "${public_key}" | ssh-keygen -l -f - >/dev/null

          password="${HOST_PASSWORD:-$(openssl rand -hex 16)}"
          echo "::add-mask::${password}"
          hash="$(printf '%s' "${password}" | openssl passwd -6 -stdin)"
          TEMPLATE=fedora-minimal/config.toml \
          OUTPUT=build/fedora-minimal-config.toml \
          PASSWORD_HASH="${hash}" \
          SSH_PUBLIC_KEY="${public_key}" \
          python3 - <<'PY'
          import os
          from pathlib import Path

          text = Path(os.environ["TEMPLATE"]).read_text()
          text = text.replace("__PASSWORD_HASH__", os.environ["PASSWORD_HASH"])
          text = text.replace("__SSH_PUBLIC_KEY__", os.environ["SSH_PUBLIC_KEY"])
          Path(os.environ["OUTPUT"]).write_text(text)
          PY

          
          if [ -n "${GH_TOKEN}" ]; then
            printf '%s' "${GH_TOKEN}" | sudo podman login ghcr.io \
              -u "${{ github.actor }}" --password-stdin
          else
            echo "Warning: GH_TOKEN not provided, skipping private registry authentication"
          fi

          build_disk() {
            local ref="$1"
            local out="$2"
            rm -rf "${out}"
            mkdir -p "${out}"
            sudo podman pull "${ref}" >&2
            sudo podman run --rm --privileged --pull=newer \
              --security-opt label=disable \
              -v "${PWD}/build/fedora-minimal-config.toml:/config.toml:ro" \
              -v "${PWD}/${out}:/output" \
              -v /var/lib/containers/storage:/var/lib/containers/storage \
              "${BIB}" \
              --type qcow2 \
              --local \
              --config /config.toml \
              "${ref}" >&2
            sudo chown -R "$(id -u):$(id -g)" build
            find "${out}" -type f -name '*.qcow2' -print -quit
          }

          test_qcow="$(build_disk "${TEST_REF}" build/fedora-minimal-test)"
          if [ -z "${test_qcow}" ]; then
            echo "bootc-image-builder did not produce a test qcow2 image" >&2
            find build/fedora-minimal-test -maxdepth 3 -type f >&2
            exit 1
          fi
          qemu-img info "${test_qcow}"
          qemu-img check "${test_qcow}"
          ./scripts/smoke-test-qcow2.sh "${test_qcow}" "${password}" fedora
          rm -rf build/fedora-minimal-test

          # Promote the moving channel only after the disk boots and passes.
          if [ "${IS_DEFAULT_BRANCH}" = "true" ]; then
            docker buildx imagetools create -t "${LATEST_REF}" "${TEST_REF}@${DIGEST}"
            final_ref="${LATEST_REF}"
          else
            final_ref="${TEST_REF}"
          fi

          final_qcow="$(build_disk "${final_ref}" build/fedora-minimal)"
          if [ -z "${final_qcow}" ]; then
            echo "bootc-image-builder did not produce the final qcow2 image" >&2
            find build/fedora-minimal -maxdepth 3 -type f >&2
            exit 1
          fi
          output="build/artifacts/fedora-minimal-${{ steps.image.outputs.version }}-amd64.qcow2"
          install -m 0644 "${final_qcow}" "${output}"
          qemu-img info "${output}"
          qemu-img check "${output}"
          ./scripts/smoke-test-qcow2.sh "${output}" "${password}" fedora
          rm -rf build/fedora-minimal build/fedora-minimal-config.toml

          printf 'user: nithin\npassword: %s\n' "${password}" > build/artifacts/credentials.txt
          (cd build/artifacts && sha256sum ./*.qcow2 > SHA256SUMS)

      - name: Upload Fedora minimal qcow2 artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fedora-minimal-${{ steps.image.outputs.version }}-amd64-qcow2
          path: build/artifacts
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish release with QCOW2 artifacts
    needs: [build-kairos, build-fedora-minimal]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Determine version and release tag
        id: version
        run: |
          set -euo pipefail
          
          # Use git tag if available, otherwise use short commit SHA
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="snapshot-${{ github.sha }}"
          fi
          
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_name=Build ${TAG}" >> "$GITHUB_OUTPUT"
          
          # Set prerelease flag for snapshots
          if [[ "${TAG}" == snapshot-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          path: artifacts

      - name: Prepare release artifacts
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          
          # Copy QCOW2 files and checksums
          find artifacts -name "*.qcow2" -exec cp {} release-artifacts/ \;
          find artifacts -name "SHA256SUMS" -exec cp {} release-artifacts/ \;
          find artifacts -name "credentials.txt" -exec cp {} release-artifacts/credentials-{} \; 2>/dev/null || true
          
          # List what we're releasing
          echo "Release artifacts:"
          ls -lh release-artifacts/ || echo "No artifacts found"

      - name: Create release with artifacts
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.release_name }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: release-artifacts/*
          body: |
            ## Build Artifacts

            This release contains VM disk images (QCOW2 format) for the sandbox environment.

            ### Contents
            - **kairos-\*.qcow2** - Fedora-based Kairos sandbox host
            - **fedora-minimal-\*.qcow2** - Minimal Fedora bootc image
            - **SHA256SUMS** - Checksums for verification
            - **credentials-\*.txt** - User credentials for the images

            ### Usage

            Boot with QEMU:
            ```bash
            qemu-system-x86_64 -m 4G -enable-kvm kairos-*.qcow2
            qemu-system-x86_64 -m 2G -enable-kvm fedora-minimal-*.qcow2
            ```

            Verify image integrity:
            ```bash
            sha256sum -c SHA256SUMS
            ```

            Credentials are in the credentials-*.txt files. Default user is `nithin`.

            ### Container Images

            Additionally, container images are available in separate packages:
            - **OpenCode**: `ghcr.io/felstormrage/agent-sandbox-image/opencode:${{ steps.version.outputs.tag }}`
            - **OpenCode CMS**: `ghcr.io/felstormrage/agent-sandbox-image/cms:${{ steps.version.outputs.tag }}`
            - **Kairos**: `ghcr.io/felstormrage/agent-sandbox-image/kairos:${{ steps.version.outputs.tag }}`
            - **Fedora Minimal**: `ghcr.io/felstormrage/agent-sandbox-image/fedora-minimal:${{ steps.version.outputs.tag }}`

            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup-old-images:
    name: Clean up old container images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - name: Delete untagged container images older than 30 days
        uses: actions/delete-package-versions@v4
        with:
          package-name: agent-sandbox-image
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: false
          delete-only-pre-release-versions: false
        continue-on-error: true

      - name: Prune container registry
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const thirtyDaysAgo = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000);
            
            console.log(`Cleaning images older than ${thirtyDaysAgo.toISOString()}`);
            console.log('Note: Container image cleanup requires manual deletion via GitHub UI or ghcr.io CLI');
            console.log('Use: gh api repos/' + owner + '/' + repo + '/packages?package_type=container');
